[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "running-coaching"
version = "0.1.0"
description = "Sistema automatizado de coaching de running con Strava + Google Sheets + Claude AI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "duckdb>=0.10.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
run-pipeline = "src.pipeline:main"
