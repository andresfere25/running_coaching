# .github/workflows/weekly_pipeline.yml
#
# Sync semanal: llama al endpoint de Railway para actualizar todos los atletas.
# Se ejecuta cada LUNES a las 11:00 UTC (6:00am Bogotá, UTC-5).
# Garantiza que el dashboard esté fresco aunque el atleta no haya subido actividades.
#
# El webhook de Strava cubre las actualizaciones en tiempo real (actividades nuevas).
# Este schedule cubre el reset semanal (semana nueva, 0 km, plan actualizado).
#
# Secrets necesarios en GitHub → Settings → Secrets → Actions:
#   RAILWAY_URL      (ej: https://runningcoaching-production.up.railway.app)
#   API_KEY          (si está configurado en Railway; dejar vacío si no hay auth)
#   CEDULA_DEFAULT   (cédula del atleta principal; default 1070982737)
#   CEDULAS_EXTRA    (opcional: cédulas adicionales separadas por coma)

name: Weekly Pipeline Sync

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 6:00am Bogotá
  workflow_dispatch:
    inputs:
      cedula:
        description: "Cédula específica (vacío = todas las configuradas)"
        required: false
        default: ""

jobs:
  sync:
    name: Sync athletes via Railway API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Sync athletes
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          API_KEY:     ${{ secrets.API_KEY }}
          CEDULA_DEFAULT: ${{ secrets.CEDULA_DEFAULT }}
          CEDULAS_EXTRA:  ${{ secrets.CEDULAS_EXTRA }}
          INPUT_CEDULA:   ${{ github.event.inputs.cedula }}
        run: |
          BASE="${RAILWAY_URL:-https://runningcoaching-production.up.railway.app}"
          MAIN="${INPUT_CEDULA:-${CEDULA_DEFAULT:-1070982737}}"

          # Construir lista de cédulas: principal + extras
          if [ -n "$CEDULAS_EXTRA" ]; then
            CEDULAS="$MAIN,${CEDULAS_EXTRA}"
          else
            CEDULAS="$MAIN"
          fi

          # Header de autenticación (opcional)
          AUTH_HEADER=""
          if [ -n "$API_KEY" ]; then
            AUTH_HEADER="-H 'X-API-Key: ${API_KEY}'"
          fi

          # Sincronizar cada cédula
          IFS=',' read -ra CEDULA_LIST <<< "$CEDULAS"
          for CEDULA in "${CEDULA_LIST[@]}"; do
            CEDULA=$(echo "$CEDULA" | tr -d ' ')
            echo "──────────────────────────────────────"
            echo "Syncing cedula: $CEDULA"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              ${API_KEY:+-H "X-API-Key: ${API_KEY}"} \
              "${BASE}/athletes/${CEDULA}/sync?steps=strava&steps=features&steps=plan&push_to_supabase=true")

            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

            echo "Status: $HTTP_STATUS"
            echo "$BODY" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print('  ok:', d.get('ok'))
              print('  stages:', d.get('stages'))
              print('  supabase ok:', (d.get('supabase') or {}).get('ok'))
          except:
              print(sys.stdin.read())
          " 2>/dev/null || echo "$BODY"

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "⚠️  Non-200 response for cedula $CEDULA — continuing"
            else
              echo "✅ Sync ok: $CEDULA"
            fi
          done

          echo "══════════════════════════════════════"
          echo "Weekly sync complete."
