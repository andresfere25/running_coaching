# .github/workflows/weekly_pipeline.yml
#
# Sync semanal: descubre automáticamente todos los atletas desde Supabase
# y llama al endpoint de Railway para actualizar cada uno.
#
# Trigger: lunes 6:00am Bogotá (UTC-5 = 11:00 UTC)
# El webhook de Strava cubre las actualizaciones en tiempo real.
# Este schedule cubre el reset semanal (nueva semana aunque no haya actividades).
#
# Sin configuración requerida — cualquier atleta que complete el OAuth
# queda automáticamente incluido en el próximo sync.

name: Weekly Pipeline Sync

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      cedula:
        description: "Cédula específica (vacío = todos los atletas activos)"
        required: false
        default: ""

jobs:
  sync:
    name: Sync all athletes via Railway API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Discover and sync athletes
        env:
          RAILWAY_URL:  ${{ secrets.RAILWAY_URL }}
          API_KEY:      ${{ secrets.API_KEY }}
          INPUT_CEDULA: ${{ github.event.inputs.cedula }}
        run: |
          set -e
          BASE="${RAILWAY_URL:-https://runningcoaching-production.up.railway.app}"

          # ── Obtener lista de atletas ──────────────────────────────────────
          if [ -n "$INPUT_CEDULA" ]; then
            echo "Modo manual: cedula=$INPUT_CEDULA"
            CEDULAS="$INPUT_CEDULA"
          else
            echo "Descubriendo atletas desde $BASE/athletes ..."
            ATHLETES_JSON=$(curl -sf \
              ${API_KEY:+-H "X-API-Key: $API_KEY"} \
              "$BASE/athletes")

            # Extraer cédulas con python3 (una por línea)
            CEDULAS=$(python3 -c "
import json, sys
data = json.loads('''$ATHLETES_JSON''')
athletes = data.get('athletes', [])
print(f'Total atletas: {len(athletes)}', file=sys.stderr)
for a in athletes:
    print(a)
")
            echo "Atletas encontrados:"
            echo "$CEDULAS"
          fi

          if [ -z "$CEDULAS" ]; then
            echo "Sin atletas para sincronizar."
            exit 0
          fi

          # ── Sincronizar cada atleta ───────────────────────────────────────
          SUCCESS=0
          FAILED=0

          while IFS= read -r CEDULA; do
            [ -z "$CEDULA" ] && continue
            echo ""
            echo "Syncing: $CEDULA"

            HTTP_STATUS=$(curl -s -o /tmp/sync_response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              ${API_KEY:+-H "X-API-Key: $API_KEY"} \
              "$BASE/athletes/$CEDULA/sync?steps=strava&steps=features&steps=plan&push_to_supabase=true")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "  ✅ OK (HTTP 200)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ FAIL (HTTP $HTTP_STATUS)"
              cat /tmp/sync_response.json 2>/dev/null | head -3
              FAILED=$((FAILED + 1))
            fi

            # Pausa para no saturar la API de Strava
            sleep 3

          done <<< "$CEDULAS"

          # ── Resumen ───────────────────────────────────────────────────────
          echo ""
          echo "════════════════════════════════════"
          echo "Sync completo: $SUCCESS ok · $FAILED fallidos"
          echo "════════════════════════════════════"

          # Solo falla el job si TODOS fallaron (0 exitosos)
          if [ $SUCCESS -eq 0 ] && [ $FAILED -gt 0 ]; then
            echo "ERROR: ningun atleta sincronizado correctamente"
            exit 1
          fi
